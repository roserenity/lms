openapi: 3.0.0
info:
  title: Aster Academy LMS API
  version: 1.0.0
  description: >
    REST API for the Aster Academy Learning Management System (standalone mode).
    All endpoints are prefixed with `/v1`. Authentication uses Laravel Passport
    Bearer tokens unless noted as public.

servers:
  - url: '{serverUrl}/v1'
    variables:
      serverUrl:
        default: 'https://lms.example.com'
        description: Base URL of the deployed backend

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
        data:
          type: object

    PaginatedResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            current_page:
              type: integer
            data:
              type: array
              items:
                type: object
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    User:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, instructor, user]
        status:
          type: string

    Course:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        price:
          type: number
        is_free:
          type: boolean
        training_hours:
          type: number
        status:
          type: string

    Module:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        course_id:
          type: integer
        sort_order:
          type: integer

    Assessment:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        course_id:
          type: integer
        passing_score:
          type: number

    Certificate:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        user_id:
          type: integer
        course_id:
          type: integer
        issued_at:
          type: string
          format: date-time

tags:
  - name: Public
    description: Publicly accessible endpoints — no authentication required
  - name: Auth
    description: Authentication and account management
  - name: Notifications
    description: User notification management
  - name: Admin — Enrollment
    description: Admin enrollment and invoice management
  - name: Admin — Users
    description: Admin user management (import, status, roles)
  - name: Admin — Class Categories
    description: Admin class category CRUD
  - name: Admin — Exports
    description: Admin export file management
  - name: Admin — Certificates
    description: Admin certificate template category management
  - name: Admin — Training Credits
    description: Admin training credit CRUD
  - name: Admin — Custom Modules
    description: Admin custom module field settings
  - name: Admin — Custom Tables
    description: Admin dynamic custom table management
  - name: Admin — Custom Registration
    description: Admin custom registration page and field management
  - name: Admin — Chat
    description: Admin private and group chat
  - name: Admin — Dashboard
    description: Admin dashboard statistics and charts
  - name: Admin — Tickets
    description: Admin support ticket management
  - name: Admin — Activity Log
    description: Admin activity log
  - name: Admin — Advisories
    description: Admin advisory CRUD
  - name: Admin — Landing Page
    description: Admin landing page background management
  - name: Admin — Documents
    description: Admin document management
  - name: Admin — Forum
    description: Admin forum post and comment management
  - name: Admin — Announcements
    description: Admin announcement management
  - name: Instructor — Courses
    description: Instructor course management
  - name: Instructor — Modules
    description: Instructor module management
  - name: Instructor — Topics
    description: Instructor topic management
  - name: Instructor — Sub-Topics
    description: Instructor sub-topic management
  - name: Instructor — Assessments
    description: Instructor assessment and question management
  - name: Instructor — Group Activities
    description: Instructor group activity and group member management
  - name: Instructor — Rubrics
    description: Instructor rubric management
  - name: Instructor — Grading
    description: Instructor grading and score management
  - name: Instructor — Student Output
    description: Instructor student progress and records
  - name: Instructor — Zoom
    description: Instructor Zoom meeting management
  - name: Instructor — Enrollment
    description: Instructor manual enrollment management
  - name: Instructor — Evaluations
    description: Instructor course and module evaluation management
  - name: Instructor — Certificates
    description: Instructor certificate generation
  - name: Instructor — Reports
    description: Instructor reporting
  - name: Instructor — SCORM
    description: Instructor SCORM content management
  - name: Instructor — Certificate Templates
    description: Instructor certificate template management
  - name: Instructor — Exports
    description: Instructor export management
  - name: Instructor — Forum
    description: Instructor forum post and comment management
  - name: Instructor — Question Pools
    description: Instructor question pool management
  - name: Instructor — Course Groups
    description: Instructor course group management
  - name: User — Courses
    description: Learner course access and progress
  - name: User — Modules
    description: Learner module navigation and content
  - name: User — Assessments
    description: Learner assessment taking
  - name: User — Chat
    description: Learner private and group chat
  - name: User — Announcements
    description: Learner announcement viewing and comments
  - name: User — Tickets
    description: Learner support tickets
  - name: User — Calendar
    description: Learner calendar events
  - name: User — Zoom
    description: Learner Zoom meeting info
  - name: User — Evaluations
    description: Learner course and module evaluation submission
  - name: User — Cart
    description: Learner shopping cart
  - name: User — Checkout
    description: Learner checkout and payment
  - name: User — Invoices
    description: Learner invoice and transaction history
  - name: User — Certificates
    description: Learner certificate download and generation
  - name: User — SCORM
    description: Learner SCORM progress tracking
  - name: User — Forum
    description: Learner forum posts and comments

paths:

  # ─── PUBLIC / AUTH ────────────────────────────────────────────────────────────

  /register:
    post:
      tags: [Public, Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password]
              properties:
                first_name: {type: string}
                middle_name: {type: string}
                last_name: {type: string}
                suffix: {type: string}
                email: {type: string, format: email}
                password: {type: string, format: password}
                class_category_id: {type: integer}
                role: {type: string}
                data: {type: object}
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /login:
    post:
      tags: [Public, Auth]
      summary: Login (throttled 3 attempts/min)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          description: Login successful — returns access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '429':
          description: Too many login attempts

  /logout:
    post:
      tags: [Auth]
      summary: Logout current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /email/verification-notification:
    post:
      tags: [Auth]
      summary: Resend email verification notification
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /email/verify:
    get:
      tags: [Auth]
      summary: Verify email address
      parameters:
        - in: query
          name: id
          schema: {type: string}
        - in: query
          name: hash
          schema: {type: string}
        - in: query
          name: expires
          schema: {type: integer}
        - in: query
          name: signature
          schema: {type: string}
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '200':
          description: Reset link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /reset-password/{token}:
    get:
      tags: [Auth]
      summary: Show password reset form
      parameters:
        - in: path
          name: token
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Reset form data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: {type: string}
                email: {type: string, format: email}
                password: {type: string}
                password_confirmation: {type: string}
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /update/password:
    put:
      tags: [Auth]
      summary: Update authenticated user password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password: {type: string}
                password: {type: string}
                password_confirmation: {type: string}
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /update/accepted-terms:
    put:
      tags: [Auth]
      summary: Accept terms and conditions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Terms accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /update/details:
    put:
      tags: [Auth]
      summary: Update user profile details
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Details updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /update/profile/photo:
    post:
      tags: [Auth]
      summary: Upload profile photo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: {type: string, format: binary}
      responses:
        '200':
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /update/info-update-flag:
    put:
      tags: [Auth]
      summary: Update needs-info-update flag for current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /user:
    get:
      tags: [Auth]
      summary: Get authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /login/history:
    get:
      tags: [Auth]
      summary: Get login history for authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Login history list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /activity-log:
    get:
      tags: [Auth]
      summary: Get activity log for authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Activity log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ─── NOTIFICATIONS ────────────────────────────────────────────────────────────

  /user/notifications:
    get:
      tags: [Notifications]
      summary: Get all notifications for authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /user/mark/notification:
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_id: {type: string}
      responses:
        '200':
          description: Notification marked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /user/mark/all/notifications:
    get:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All notifications marked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ─── PUBLIC TENANT INFO ───────────────────────────────────────────────────────

  /tenants/info:
    get:
      tags: [Public]
      summary: Get tenant configuration and branding
      responses:
        '200':
          description: Tenant info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/custom-registration/pages:
    get:
      tags: [Public]
      summary: Get custom registration pages for this tenant
      responses:
        '200':
          description: Registration pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/class-categories:
    get:
      tags: [Public]
      summary: Get all class categories
      responses:
        '200':
          description: Class categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/random/class-categories:
    get:
      tags: [Public]
      summary: Get random class categories
      responses:
        '200':
          description: Random class categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/browse-courses:
    get:
      tags: [Public]
      summary: Get grouped courses for public browsing
      responses:
        '200':
          description: Grouped courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/course-availability-dates:
    get:
      tags: [Public]
      summary: Get course availability dates
      responses:
        '200':
          description: Availability dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/training-credits:
    get:
      tags: [Public]
      summary: Get available training credits
      responses:
        '200':
          description: Training credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/backgrounds:
    get:
      tags: [Public]
      summary: Get tenant background images
      responses:
        '200':
          description: Background images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/courses:
    get:
      tags: [Public]
      summary: Get public course listing
      responses:
        '200':
          description: Courses list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/courses/all:
    post:
      tags: [Public]
      summary: Get all courses with filters
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filters: {type: object}
                page: {type: integer}
                per_page: {type: integer}
      responses:
        '200':
          description: Paginated courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /tenants/courses/free:
    get:
      tags: [Public]
      summary: Get free courses
      responses:
        '200':
          description: Free courses list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/courses/{course_uuid}:
    get:
      tags: [Public]
      summary: Get a public course by UUID
      parameters:
        - in: path
          name: course_uuid
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/advisories:
    get:
      tags: [Public]
      summary: Get public advisories
      responses:
        '200':
          description: Advisories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/view/certificate/{certificate_uuid}:
    get:
      tags: [Public]
      summary: View a certificate publicly
      parameters:
        - in: path
          name: certificate_uuid
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/payment-status/check:
    get:
      tags: [Public]
      summary: Check payment gateway status
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/request/official-receipt:
    post:
      tags: [Public]
      summary: Request official receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Receipt requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/checkout/callback:
    post:
      tags: [Public]
      summary: Payment gateway checkout callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Callback processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/send/contact/mail:
    post:
      tags: [Public]
      summary: Send contact form email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                email: {type: string, format: email}
                message: {type: string}
      responses:
        '200':
          description: Email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/course/upload/callback:
    post:
      tags: [Public]
      summary: SCORM Cloud course upload webhook callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Callback handled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tenants/course/registration/postback:
    post:
      tags: [Public]
      summary: SCORM Cloud course registration postback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Postback handled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  # ─── ADMIN — ENROLLMENT ───────────────────────────────────────────────────────

  /enrollment/import/users:
    post:
      tags: [Admin — Enrollment]
      summary: Import enrollees from CSV/Excel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /enrollments/user/{user_id}:
    get:
      tags: [Admin — Enrollment]
      summary: Get enrolled courses for a user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Enrolled courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Admin — Enrollment]
      summary: Enroll user in multiple courses
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                course_ids: {type: array, items: {type: integer}}
      responses:
        '200':
          description: Enrollment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /enrollments/user/{user_id}/enroll:
    post:
      tags: [Admin — Enrollment]
      summary: Enroll user in a single course
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                course_id: {type: integer}
      responses:
        '200':
          description: Enrollment successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /enrollments/{enrollment_id}:
    delete:
      tags: [Admin — Enrollment]
      summary: Delete an enrollment
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: enrollment_id
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Enrollment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /enrollment/courses:
    get:
      tags: [Admin — Enrollment, Instructor — Enrollment]
      summary: Get courses available for enrollment management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Courses list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /enrollment/courses/export:
    post:
      tags: [Admin — Enrollment, Instructor — Enrollment]
      summary: Export course invoices
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Export file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /enrollment/course/{course_uuid}/enrollees:
    get:
      tags: [Admin — Enrollment, Instructor — Enrollment]
      summary: Get enrollees for a specific course
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: course_uuid
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Enrollees list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /enrollment/invoice/status:
    put:
      tags: [Admin — Enrollment]
      summary: Update invoice payment status
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invoice_id: {type: integer}
                status: {type: string}
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /enrollment/invoice/type_of_payment:
    put:
      tags: [Admin — Enrollment]
